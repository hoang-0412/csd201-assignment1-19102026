#ASSIGNMENT 01 
#Implement a self-balancing binary search tree (AVL Tree) to perform insertion, deletion, searching, and traversal. Students will demonstrate understanding of data structures, recursion, and tree balancing algorithms. 
#A Binary Search Tree (BST) allows fast searching, insertion, and deletion. However, if the tree becomes unbalanced, performance degrades to O(n). 
#To overcome this, an AVL Tree (invented by Adelson-Velsky and Landis) automatically balances itself after every insertion or deletion using rotations. 
